<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人信息</title>
</head>
<body>
<h2>个人信息完善</h2>

<p th:if="${message}" th:text="${message}"></p>

<div th:if="${accountId == null}">
    <p>请先登录后再完善信息。</p>
    <a th:href="@{/user/login}">去登录</a>
</div>

<div th:if="${accountId != null}">
    <p>当前账号：<span th:text="${accountId}"></span>（<span th:text="${role}"></span>）</p>
    <form th:action="@{/user/info}" method="post">
        <label>
            姓名：
            <input type="text" name="name" th:value="${readerInfo != null ? readerInfo.name : ''}" required>
        </label>
        <br>
        <label>
            性别：
            <input type="text" name="gender" th:value="${readerInfo != null ? readerInfo.gender : ''}" required>
        </label>
        <br>
        <label>
            手机号：
            <input type="text" name="mobile" th:value="${readerInfo != null ? readerInfo.mobile : ''}" required>
        </label>
        <br>
        <label>
            密码验证：
            <input type="password" name="password" required>
        </label>
        <br>
        <button type="submit">保存信息</button>
    </form>
</div>

<a th:href="@{/user}">返回用户管理目录</a>
</body>
</html>
