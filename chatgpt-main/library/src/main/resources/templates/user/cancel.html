<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>账号注销</title>
</head>
<body>
<h2>账号注销</h2>

<p th:if="${message}" th:text="${message}"></p>

<form th:action="@{/user/cancel}" method="post">
    <label>
        账号类型：
        <select name="role" required>
            <option value="TEACHER">教师账号</option>
            <option value="STUDENT">学生账号</option>
        </select>
    </label>
    <br>
    <label>
        工号/借书证号：
        <input type="text" name="accountId" required>
    </label>
    <br>
    <label>
        密码：
        <input type="password" name="password" required>
    </label>
    <br>
    <button type="submit">确认注销</button>
</form>

<a th:href="@{/user}">返回用户管理目录</a>
</body>
</html>
